services:

  config-server:
    image: config-server:1.0
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - backend-network
    restart: unless-stopped

  discovery-server:
    image: discovery-server:1.0
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - backend-network
    depends_on:
      - config-server
    restart: unless-stopped

  authorization-server:
    image: authorization-server:1.0
    container_name: authorization-server
    ports:
      - "9000:9000"
    networks:
      - backend-network
    environment:
      SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUER: "http://host.docker.internal:9000"
    depends_on:
      - config-server
    restart: unless-stopped

  bank-service:
    image: bank-service:1.0
    container_name: bank-service
    ports:
      - "8091:8091"
    networks:
      - backend-network

    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"

      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@host.docker.internal:1521/XEPDB1"
      SPRING_DATASOURCE_USERNAME: "BANK_BATCH"
      SPRING_DATASOURCE_PASSWORD: "BankBatch123"

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://host.docker.internal:9000"

      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

    depends_on:
      - config-server
      - discovery-server
      - authorization-server

    restart: unless-stopped

networks:
  backend-network:
    driver: bridge