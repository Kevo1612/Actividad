spring.application.name=demo

# ==========================================
# CONEXION A ORACLE
# ==========================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=BANK_BATCH
spring.datasource.password=BankBatch123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=none
# SQL de Hibernate apagado (WARN no imprime nada en condiciones normales).
# Si en algún momento quieres volver a ver el SQL con el hilo que lo generó
# (para evidenciar el multi-threading), cambia esto a DEBUG.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# ==========================================
# POOL DE CONEXIONES (HikariCP)
# ==========================================
# El step de transacciones corre multi-thread (ver BatchTaskExecutorConfig,
# maxPoolSize=8). Cada hilo necesita su propia conexión JDBC durante el
# commit del chunk (RepositoryItemWriter), más las conexiones que usa el
# propio JobRepository de Spring Batch. Se deja margen por sobre el
# maxPoolSize del executor para evitar contención esperando conexión.
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=4

# ==========================================
# SPRING BATCH
# ==========================================
spring.batch.jdbc.initialize-schema=always

# ==========================================
# CONFIGURACION DEL JOB
# ==========================================
spring.batch.job.enabled=false